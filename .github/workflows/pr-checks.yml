name: pr-checks

# PR-time gates for gi-plugins. Three jobs in one wall: it gives branch protection a
# required status check (without one, "require branches up to date before merge" does
# not actually enforce), and it catches a plugin/marketplace version desync before
# merge rather than after (the continuous-delivery model requires the two manifests to
# carry the same version). See plugin-development-process.md (parent repo) ->
# "Release Cadence & Concurrency".

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-sync:
    name: manifest-sync
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (repo convention; see auto-tag-release.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Plugin + marketplace versions must match
        run: |
          set -euo pipefail
          plugin_ver=$(jq -r '.version' plugins/lee-internal-comps/.claude-plugin/plugin.json)
          # Single-plugin marketplace; [0] is the lee-internal-comps plugin.
          mkt_ver=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)

          if [ -z "$plugin_ver" ] || [ "$plugin_ver" = "null" ]; then
            echo "::error::plugin.json has no .version"
            exit 1
          fi
          if [ "$plugin_ver" != "$mkt_ver" ]; then
            echo "::error::version desync -- plugin.json=$plugin_ver marketplace.json=$mkt_ver. Bump BOTH manifests in the same PR (Release Cadence rule)."
            exit 1
          fi
          echo "Manifest versions in sync: ${plugin_ver}"

  connector-auth-guidance:
    name: connector-auth-guidance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # gi-plugins#117: every lee-raleigh-riding SKILL.md must carry the
      # canonical connector-auth block verbatim (attempt-the-call-first +
      # broker-legible reconnect copy). Deterministic, no API calls.
      - name: Connector-auth block present and un-drifted in every covered skill
        run: bash scripts/test/connector-auth-guidance.test.sh

  miss-protocol-guidance:
    name: miss-protocol-guidance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # gi-plugins#164 (program lee#530): every lee-raleigh-riding SKILL.md
      # must carry the canonical miss-protocol block verbatim, and none may
      # keep the retired "ask the broker for a hint" prose. Deterministic.
      - name: Miss-protocol block present and un-drifted; retired punt prose gone
        run: bash scripts/test/miss-protocol-guidance.test.sh

  source-neutrality:
    name: source-neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Company policy (2026-08-14): no comps-data vendor proper noun anywhere
      # in the repo (broker-surface guard remains as the belt to this suspenders).
      - name: No data-vendor proper nouns repo-wide
        run: bash scripts/test/source-neutrality.sh

      - name: No vendor brand on broker-facing surfaces
        run: bash scripts/test/no-costar-broker-surfaces.sh

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # gi-plugins#137: the full-dir suite silently carried 14 false failures
      # (helpers.py module-name collision) for weeks because nothing ran pytest
      # in CI. The whole suite runs in <1s; keep it a required gate.
      - name: Skill test suite (full dir, one invocation)
        run: |
          # pillow: openpyxl needs it to embed the Lee logo images in the Excel tests
          pip install --quiet pytest openpyxl pillow
          python3 -m pytest plugins/lee-internal-comps/tests/ -q
